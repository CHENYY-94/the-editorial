<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Editorial - CHEN Ziying</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2317181b'/%3E%3Cpath d='M16 8c-2.5-1.8-5.5-2-8-1v16c2.5-1 5.5-.8 8 1 2.5-1.8 5.5-2 8-1V7c-2.5-1-5.5-.8-8 1z' fill='none' stroke='%23f5f1ea' stroke-width='1.6'/%3E%3Cpath d='M16 8v16' stroke='%23f5f1ea' stroke-width='1.6'/%3E%3C/svg%3E">
<style>
:root{
  --desk: oklch(0.21 0.008 260);
  --desk-2: oklch(0.26 0.009 260);
  --paper: oklch(0.95 0.012 90);
  --ink: oklch(0.24 0.01 260);
  --muted: oklch(0.72 0.012 90);
  --line: oklch(0.95 0.012 90 / 0.16);
  --line-soft: oklch(0.95 0.012 90 / 0.09);
  --accent: oklch(0.83 0.03 90);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font:15px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--paper);
  background:
    radial-gradient(120% 90% at 50% 0%, var(--desk-2), var(--desk) 62%);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
img{max-width:100%;display:block}
button{cursor:pointer;font:inherit;color:inherit;background:none;border:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}

.stage{height:100dvh;display:flex;flex-direction:column}

/* ---------- top bar ---------- */
.topbar{
  display:flex;align-items:baseline;justify-content:space-between;gap:16px;
  padding:18px clamp(16px,4vw,40px) 10px;
  border-bottom:1px solid var(--line-soft);
  flex:none;
}
.brand{display:flex;align-items:baseline;gap:14px;min-width:0}
.eyebrow{
  font-size:11px;letter-spacing:0.28em;text-transform:uppercase;color:var(--muted);
  white-space:nowrap;
}
.masthead{
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(17px,2.2vw,22px);letter-spacing:0.08em;white-space:nowrap;
}
.issue{
  font-size:11px;letter-spacing:0.24em;text-transform:uppercase;color:var(--muted);
  white-space:nowrap;
}

/* ---------- book ---------- */
.book-wrap{
  flex:1;min-height:0;
  display:flex;align-items:center;justify-content:center;
  padding:20px 16px;
}
#book{
  position:relative;
  filter:drop-shadow(0 34px 44px rgb(0 0 0 / 0.5)) drop-shadow(0 6px 14px rgb(0 0 0 / 0.4));
}
.page{background:var(--paper);position:relative}
.page img{width:100%;height:100%;object-fit:cover;user-select:none;-webkit-user-drag:none}
/* transparent clickable zones rebuilt from the Figma prototype links */
.hotspot{
  position:absolute;display:block;border-radius:3px;
  background:transparent;outline-offset:-2px;
  -webkit-tap-highlight-color:transparent;
}
.hotspot:hover{background:rgb(26 26 30 / 0.045)}

/* stPageFlip internals: center the spread and soften shadows */
.stf__parent{margin:0 auto}
.stf__block{position:relative}
.stf__item{position:absolute}

/* ---------- controls ---------- */
.controls{
  flex:none;
  display:flex;align-items:center;justify-content:center;gap:clamp(12px,3vw,28px);
  padding:12px 16px 20px;
}
.navbtn{
  width:46px;height:46px;border-radius:50%;
  border:1px solid var(--line);
  display:grid;place-items:center;color:var(--paper);
  transition:background-color .2s ease,border-color .2s ease,transform .15s ease,opacity .2s ease;
  flex:none;
}
.navbtn:hover:not(:disabled){background:var(--line-soft);border-color:var(--line);transform:translateY(-1px)}
.navbtn:active:not(:disabled){transform:translateY(0) scale(.96)}
.navbtn:disabled{opacity:.28;cursor:default}
.navbtn svg{width:20px;height:20px}

.progress{
  display:flex;align-items:center;gap:16px;min-width:0;width:min(340px,44vw);
}
.page-label{
  font-size:12px;letter-spacing:0.22em;text-transform:uppercase;color:var(--muted);
  font-variant-numeric:tabular-nums;white-space:nowrap;
}
.track{
  flex:1;height:2px;background:var(--line-soft);border-radius:2px;overflow:hidden;min-width:60px;
}
.track i{
  display:block;height:100%;width:0%;
  background:var(--accent);border-radius:2px;
  transition:width .45s ease;
}

/* ---------- loading ---------- */
#loader{
  position:fixed;inset:0;z-index:50;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  background:var(--desk);
  transition:opacity .6s ease,visibility .6s ease;
  pointer-events:none;
}
#loader.done{opacity:0;visibility:hidden}
#loader .bar{width:min(260px,60vw);height:2px;background:var(--line-soft);border-radius:2px;overflow:hidden}
#loader .bar i{display:block;height:100%;width:0%;background:var(--accent);transition:width .25s ease}
#loader span{font-size:11px;letter-spacing:0.3em;text-transform:uppercase;color:var(--muted)}

@media (max-width:640px){
  .eyebrow{display:none}
  .issue{font-size:10px;letter-spacing:0.18em}
  .progress{width:auto;flex:1;max-width:220px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<div id="loader" aria-hidden="true">
  <div class="bar"><i id="loadbar"></i></div>
  <span>Pressing the issue</span>
</div>

<div class="stage">
  <header class="topbar">
    <div class="brand">
      <span class="eyebrow">A Digital Magazine Portfolio</span>
      <span class="masthead">THE EDITORIAL</span>
    </div>
    <div class="issue">Issue 01 · Portfolio · 2026</div>
  </header>

  <main class="book-wrap">
    <div id="book" role="region" aria-label="Portfolio magazine — use arrow keys or the buttons to flip pages"></div>
  </main>

  <footer class="controls">
    <button id="prev" class="navbtn" aria-label="Flip back (to the right)" title="上一页 (←)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="progress">
      <span class="page-label" id="pageLabel">Cover</span>
      <div class="track" aria-hidden="true"><i id="thumb"></i></div>
    </div>
    <button id="next" class="navbtn" aria-label="Flip forward (to the left)" title="向左翻页 (→)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </footer>
</div>

<script src="./vendor/page-flip.browser.js"></script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
